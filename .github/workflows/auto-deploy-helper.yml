name: Auto Generate and Sync Files

on:
  workflow_dispatch: # กดสั่งรันเองได้จากหน้า GitHub Actions
  push:
    branches:
      - main

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ให้สิทธิ์ GitHub Actions ในการเขียนและcommit โค้ดกลับเข้า repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Auto-generation Script
        run: |
          echo "กำลังประมวลผลและสร้างไฟล์ใหม่จากโค้ดต้นแบบ..."
          # ตัวอย่าง: เรียกใช้ script ของคุณเพื่อสร้างไฟล์ใหม่ (เช่น node scripts/generate.js)
          # node scripts/generate.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: auto-generate files from template [skip ci]" && git push)

